<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumes · VC Recruitment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="drive">
  <header class="site">
    <span class="brand">VC Recruitment</span>
    <nav>
      <a href="jobs.html">Open roles</a>
      <a href="recruiter.html">Recruiter</a>
      <a href="drive.html" class="active">Resumes</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <main>
    <h1>Resumes</h1>
    <p class="lede">Resumes read live from the shared Google Drive folder. Nothing is downloaded to this machine and nothing is saved to the database &mdash; each file is parsed in memory and discarded.</p>
    <div id="banner" class="banner"></div>

    <div class="toolbar">
      <div class="switch" id="view-switch" role="group" aria-label="Which resumes to show">
        <input type="radio" name="view" id="view-candidates" value="candidates" checked>
        <label for="view-candidates">Candidates</label>
        <input type="radio" name="view" id="view-applicants" value="applicants">
        <label for="view-applicants">Applicants</label>
      </div>
      <div class="grow"><div class="counts" id="counts"></div></div>
      <button id="refresh" class="ghost">Check Drive for changes</button>
      <button id="rebuild" class="ghost">Rebuild all</button>
    </div>

    <div id="list"><div class="spinner">Reading resumes from Drive&hellip;</div></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
